name: Build Mahindra BSVI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply final UX and camera patch
        run: python3 build/final_ux_patch.py

      - name: Apply guaranteed login startup fix
        run: python3 build/startup_fix.py

      - name: Apply deterministic network/login fix
        run: python3 build/network_fix.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahindra-BSVI-Driver-Guide-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
